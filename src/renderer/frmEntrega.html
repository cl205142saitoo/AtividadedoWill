<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Jogo</title>
    <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <h4 class="mb-3 text-primary">Cadastrar Entrega</h4>

    <div id="mensagem" class="alert d-none" role="alert"></div>

    <form id="formEntrega">
        <div class="mb-3">
            <label for="destinatario" class="form-label">Destinatário</label>
            <input type="text" id="destinatario" name="destinatario" class="form-control" maxlength="100" required>
        </div>

        <div class="mb-3">
            <label for="produto" class="form-label">Produto</label>
            <input type="text" id="produto" name="produto" class="form-control" maxlength="100" placeholder="Ex: Anel" required>
        </div>

        <div class="mb-3">
            <label for="quantidade" class="form-label">Quantidade</label>
            <input type="number" id="quantidade" name="quantidade" class="form-control" min="1" max="100" required>
        </div>

        <div class="mb-3">
            <label for="cep" class="form-label">CEP</label>
            <input type="text" id="cep" name="cep" class="form-control" maxlength="9" placeholder="Ex: 12345-678" required>
        </div>

        <div class="mb-3">
            <label for="endereco" class="form-label">Endereço</label>
            <input type="text" id="endereco" name="endereco" class="form-control" maxlength="255" placeholder="Ex: Rua Exemplo, 123" required>
        </div>

        <p id="infoExtraCep" class="text-muted mt-1 mb-0"></p>

        <div class="mb-3">
            <label for="data_entrega" class="form-label">Data de Entrega</label>
            <input type="date" id="data_entrega" name="data_entrega" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold">Salvar</button>
    </form>

    <script src="js/frmEntrega.js"></script>
</body>
</html>
